file_format: definition/2

attributes:
  # Browser

  - key: browser.brands
    type: string[]
    stability: development
    brief: Array of brand name and version separated by a space.
    note: >
      This value is intended to be taken from the
      [UA client hints API](https://wicg.github.io/ua-client-hints/#interface)
      (`navigator.userAgentData.brands`).
    examples: [[" Not A;Brand 99", "Chromium 99", "Chrome 99"]]

  - key: browser.platform
    type: string
    stability: development
    brief: The platform on which the browser is running.
    note: |
      This value is intended to be taken from the
      [UA client hints API](https://wicg.github.io/ua-client-hints/#interface)
      (`navigator.userAgentData.platform`). If unavailable, the legacy
      `navigator.platform` API SHOULD NOT be used instead and this attribute
      SHOULD be left unset in order for the values to be consistent.

      The list of possible values is defined in the
      [W3C User-Agent Client Hints specification](https://wicg.github.io/ua-client-hints/#sec-ch-ua-platform).
      Note that some (but not all) of these values can overlap with values
      in the [`os.type` and `os.name` attributes](https://opentelemetry.io/docs/specs/semconv/registry/attributes/os/).
      However, for consistency, the values in the `browser.platform` attribute
      should capture the exact value that the user agent provides.
    examples: ["Windows", "macOS", "Android"]

  - key: browser.mobile
    type: boolean
    stability: development
    brief: A boolean that is true if the browser is running on a mobile device.
    note: >
      This value is intended to be taken from the
      [UA client hints API](https://wicg.github.io/ua-client-hints/#interface)
      (`navigator.userAgentData.mobile`). If unavailable, this attribute
      SHOULD be left unset.

  - key: browser.language
    type: string
    stability: development
    brief: Preferred language of the user using the browser.
    note: >
      This value is intended to be taken from the Navigator API
      `navigator.language`.
    examples: ["en", "en-US", "fr", "fr-FR"]

  # Document

  - key: browser.document.url.full
    type: string
    stability: development
    brief: >
      Absolute URL of the current browser document according to [RFC3986](https://www.rfc-editor.org/rfc/rfc3986).
    examples: ["https://www.example.com/search?q=OpenTelemetry#SemConv"]

  # Console

  - key: browser.console.method
    type:
      members:
        - id: log
          value: "log"
          stability: development
          brief: "`console.log` was called."
        - id: info
          value: "info"
          stability: development
          brief: "`console.info` was called."
        - id: warn
          value: "warn"
          stability: development
          brief: "`console.warn` was called."
        - id: error
          value: "error"
          stability: development
          brief: "`console.error` was called."
        - id: debug
          value: "debug"
          stability: development
          brief: "`console.debug` was called."
    stability: development
    brief: >
      The console method that was called.
    examples: ["error"]

  # Navigation

  - key: browser.navigation.same_document
    type: boolean
    stability: development
    brief: >
      Whether the navigation happened within the same document, without a full document load.
    note: >
      Soft navigations performed by a single-page application through the History or Navigation
      API are same-document navigations; the initial page load is not.
    examples: [true, false]

  - key: browser.navigation.hash_change
    type: boolean
    stability: development
    brief: >
      Whether the navigation added or changed the fragment of the URL.
    note: >
      A navigation that removes the fragment is not reported as a hash change, even though
      only the fragment changed.
    examples: [true, false]

  - key: browser.navigation.type
    type:
      members:
        - id: push
          value: "push"
          stability: development
          brief: A new entry was added to the history, e.g. by `history.pushState()`.
        - id: replace
          value: "replace"
          stability: development
          brief: The current history entry was replaced, e.g. by `history.replaceState()`.
        - id: reload
          value: "reload"
          stability: development
          brief: The current history entry was reloaded.
        - id: traverse
          value: "traverse"
          stability: development
          brief: An existing history entry was navigated to, e.g. by the back or forward button.
    stability: development
    brief: >
      The type of the navigation, as reported by the
      [Navigation API](https://developer.mozilla.org/docs/Web/API/NavigateEvent/navigationType).
    examples: ["push"]

  # Navigation timing
  #
  # Sourced from the
  # [PerformanceNavigationTiming](https://developer.mozilla.org/docs/Web/API/PerformanceNavigationTiming)
  # API. `PerformanceNavigationTiming` extends `PerformanceResourceTiming`, so the timings and
  # transfer sizes it inherits are described by the `browser.resource_timing.*` attributes
  # below rather than duplicated here.

  - key: browser.navigation_timing.type
    type:
      members:
        - id: navigate
          value: "navigate"
          stability: development
          brief: Navigation started by clicking a link, entering a URL, a form submission, or a script operation.
        - id: reload
          value: "reload"
          stability: development
          brief: Navigation through a reload operation or a `Location.reload()` call.
        - id: back_forward
          value: "back_forward"
          stability: development
          brief: Navigation through the browser's history traversal, e.g. the back or forward button.
    stability: development
    brief: >
      The type of the navigation, as reported by
      [`PerformanceNavigationTiming.type`](https://developer.mozilla.org/docs/Web/API/PerformanceNavigationTiming/type).
    examples: ["navigate"]

  - key: browser.navigation_timing.dom_interactive
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the start of the navigation, at which the parser
      finished its work on the main document.
    examples: [124.5]

  - key: browser.navigation_timing.dom_content_loaded_event_start
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the start of the navigation, immediately before the
      `DOMContentLoaded` event handlers of the document start to run.
    examples: [128.0]

  - key: browser.navigation_timing.dom_content_loaded_event_end
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the start of the navigation, immediately after the
      `DOMContentLoaded` event handlers of the document finish running.
    examples: [131.2]

  - key: browser.navigation_timing.dom_complete
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the start of the navigation, at which the document and
      all of its subresources finished loading.
    examples: [520.7]

  - key: browser.navigation_timing.load_event_start
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the start of the navigation, immediately before the
      `load` event handlers of the document start to run.
    examples: [521.0]

  - key: browser.navigation_timing.load_event_end
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the start of the navigation, immediately after the
      `load` event handlers of the document finish running.
    examples: [523.4]

  - key: browser.navigation_timing.unload_event_start
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the start of the navigation, immediately before the
      `unload` event handlers of the previous document start to run.
    note: >
      Zero if there was no previous document, or if the previous document has a different
      origin.
    examples: [0.0]

  - key: browser.navigation_timing.unload_event_end
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the start of the navigation, immediately after the
      `unload` event handlers of the previous document finish running.
    note: >
      Zero if there was no previous document, or if the previous document has a different
      origin.
    examples: [0.0]

  - key: browser.navigation_timing.redirect_count
    type: int
    stability: development
    brief: >
      The number of redirects since the last non-redirect navigation in the current browsing
      context.
    examples: [0, 2]

  # Resource timing

  - key: browser.resource_timing.initiator_type
    type: string
    stability: development
    brief: >
      The type of the resource that initiated the performance entry, as reported by
      [`PerformanceResourceTiming.initiatorType`](https://developer.mozilla.org/docs/Web/API/PerformanceResourceTiming/initiatorType).
    examples: ["script", "link", "img", "fetch", "xmlhttprequest"]

  - key: browser.resource_timing.duration
    type: double
    stability: development
    brief: >
      The total time, in milliseconds, taken to fetch the resource.
    examples: [42.3]

  - key: browser.resource_timing.worker_start
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the time origin of the document, immediately before
      the request is dispatched to a service worker.
    note: >
      Zero if the request is not intercepted by a service worker.
    examples: [0.0, 12.1]

  - key: browser.resource_timing.redirect_start
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the time origin of the document, at the start of the
      fetch that initiated the first redirect.
    note: >
      Zero if there was no redirect, or if the timing-allow checks fail.
    examples: [0.0]

  - key: browser.resource_timing.redirect_end
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the time origin of the document, immediately after
      receiving the last byte of the response of the last redirect.
    note: >
      Zero if there was no redirect, or if the timing-allow checks fail.
    examples: [0.0]

  - key: browser.resource_timing.fetch_start
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the time origin of the document, immediately before
      the browser starts to fetch the resource.
    examples: [1.2]

  - key: browser.resource_timing.domain_lookup_start
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the time origin of the document, immediately before
      the browser starts the domain name lookup for the resource.
    examples: [1.4]

  - key: browser.resource_timing.domain_lookup_end
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the time origin of the document, immediately after
      the browser finishes the domain name lookup for the resource.
    examples: [3.6]

  - key: browser.resource_timing.connect_start
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the time origin of the document, immediately before
      the browser starts to establish the connection to the server.
    examples: [3.6]

  - key: browser.resource_timing.connect_end
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the time origin of the document, immediately after
      the browser finishes establishing the connection to the server.
    examples: [12.8]

  - key: browser.resource_timing.secure_connection_start
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the time origin of the document, immediately before
      the browser starts the handshake process to secure the connection.
    note: >
      Zero if the resource is not fetched over a secure connection.
    examples: [6.0]

  - key: browser.resource_timing.request_start
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the time origin of the document, immediately before
      the browser starts requesting the resource from the server.
    examples: [12.9]

  - key: browser.resource_timing.response_start
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the time origin of the document, immediately after
      the browser receives the first byte of the response.
    examples: [38.1]

  - key: browser.resource_timing.response_end
    type: double
    stability: development
    brief: >
      Time, in milliseconds relative to the time origin of the document, immediately after
      the browser receives the last byte of the resource, or immediately before the transport
      connection is closed, whichever comes first.
    examples: [43.5]

  - key: browser.resource_timing.transfer_size
    type: int
    stability: development
    brief: >
      The transfer size of the resource, in bytes, as reported by the browser.
    note: >
      The browser uses a fixed 300-byte allowance for response headers, added to the encoded
      body size. For locally cached responses the transfer size is zero; for revalidated cached
      responses it is 300 bytes. This value is not an exact count of bytes transferred over the
      network.
    examples: [4096]

  - key: browser.resource_timing.encoded_body_size
    type: int
    stability: development
    brief: >
      The size, in bytes, of the payload body as received from the network, before removing any
      applied content encoding.
    examples: [3840]

  - key: browser.resource_timing.decoded_body_size
    type: int
    stability: development
    brief: >
      The size, in bytes, of the message body after removing any applied content encoding.
    examples: [10240]

  - key: browser.resource_timing.next_hop_protocol
    type: string
    stability: development
    brief: >
      The network protocol used to fetch the resource, as identified by the
      [ALPN Protocol ID](https://www.rfc-editor.org/rfc/rfc7301.html).
    note: >
      This attribute preserves the raw ALPN protocol ID reported by the browser.
      `network.protocol.name` and `network.protocol.version` describe the protocol name and version
      separately; for example, `h2` corresponds to `http` and `2`, respectively.
      Empty for cross-origin resources that are not served with a `Timing-Allow-Origin`
      response header field.
    examples: ["http/1.1", "h2", "h3"]

  - key: browser.resource_timing.render_blocking_status
    type:
      members:
        - id: blocking
          value: "blocking"
          stability: development
          brief: The resource blocked rendering.
        - id: non_blocking
          value: "non-blocking"
          stability: development
          brief: The resource did not block rendering.
    stability: development
    brief: >
      The render-blocking status of the resource, as reported by
      [`PerformanceResourceTiming.renderBlockingStatus`](https://developer.mozilla.org/docs/Web/API/PerformanceResourceTiming/renderBlockingStatus).
    examples: ["blocking"]

  # Web vitals

  - key: browser.web_vital.name
    type:
      members:
        - id: cls
          value: "cls"
          stability: development
          brief: Cumulative Layout Shift. See [cls](https://web.dev/articles/cls).
        - id: lcp
          value: "lcp"
          stability: development
          brief: Largest Contentful Paint. See [lcp](https://web.dev/articles/lcp).
        - id: fcp
          value: "fcp"
          stability: development
          brief: First Contentful Paint. See [fcp](https://web.dev/articles/fcp).
        - id: inp
          value: "inp"
          stability: development
          brief: Interaction to Next Paint. See [inp](https://web.dev/articles/inp).
        - id: ttfb
          value: "ttfb"
          stability: development
          brief: Time to First Byte. See [ttfb](https://web.dev/articles/ttfb).
        - id: fid
          value: "fid"
          stability: development
          brief: First Input Delay. See [fid](https://web.dev/articles/fid).
          deprecated:
            reason: obsoleted
            note: Replaced by Interaction to Next Paint (`inp`), which became a Core Web Vital in March 2024. See [inp](https://web.dev/articles/inp).
    stability: development
    brief: Name of the web vital.
    examples: ["cls"]

  - key: browser.web_vital.value
    type: double
    stability: development
    brief: Value of the web vital.
    examples: [1.0]

  - key: browser.web_vital.delta
    type: double
    stability: development
    brief: >
      The delta between the current value and the last-reported value. See
      [delta](https://github.com/GoogleChrome/web-vitals?tab=readme-ov-file#report-only-the-delta-of-changes).
    examples: [0.2]

  - key: browser.web_vital.id
    type: string
    stability: development
    brief: A unique ID representing this particular metric instance.
    examples: ["v3-1677874579383-6381583661209"]

  - key: browser.web_vital.rating
    type:
      members:
        - id: good
          value: "good"
          stability: development
          brief: The metric value is within the "good" threshold.
        - id: needs_improvement
          value: "needs-improvement"
          stability: development
          brief: The metric value is within the "needs improvement" threshold.
        - id: poor
          value: "poor"
          stability: development
          brief: The metric value is within the "poor" threshold.
    stability: development
    brief: >
      The rating of the web vital value against the "good", "needs improvement",
      and "poor" thresholds defined for the metric.
    examples: ["good"]

  - key: browser.web_vital.navigation_type
    type:
      members:
        - id: navigate
          value: "navigate"
          stability: development
          brief: Navigation started by clicking a link, entering a URL, form submission, or a script operation.
        - id: reload
          value: "reload"
          stability: development
          brief: Navigation through a reload operation or a `Location.reload()` call.
        - id: back_forward
          value: "back-forward"
          stability: development
          brief: Navigation through the browser's history traversal (e.g. back/forward buttons).
        - id: back_forward_cache
          value: "back-forward-cache"
          stability: development
          brief: Navigation restoring a page from the back/forward cache (bfcache).
        - id: prerender
          value: "prerender"
          stability: development
          brief: Navigation to a page that was prerendered.
        - id: restore
          value: "restore"
          stability: development
          brief: Navigation restoring a page that was previously discarded by the browser.
    stability: development
    brief: >
      The type of navigation, as reported by the
      [Navigation Timing API](https://developer.mozilla.org/docs/Web/API/PerformanceNavigationTiming/type),
      with additional values reported by the web-vitals library.
    examples: ["navigate"]
