name: OSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: '47 20 * * 2' # weekly at 20:47 (UTC) on Tuesday
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: OSSF Scorecard analysis
    runs-on: ubuntu-latest
    concurrency:
      group: scorecard-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      security-events: write # for Code scanning upload
      id-token: write # for publishing results with GitHub OIDC
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Upload the results as artifacts (optional). Commenting out will disable
      # uploads of run results in SARIF format to the repository Actions tab.
      # https://docs.github.com/en/actions/advanced-guides/storing-workflow-data-as-artifacts
      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Upload the results to GitHub's code scanning dashboard (optional).
      # Commenting out will disable upload of results to your repo's Code Scanning dashboard
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
